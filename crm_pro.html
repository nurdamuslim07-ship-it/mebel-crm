<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мебель CRM Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blur: blur(24px) saturate(180%);
  --blur-sm: blur(12px) saturate(160%);
  --bg-base: #0a0a0f;
  --glass-1: rgba(255,255,255,0.07);
  --glass-2: rgba(255,255,255,0.12);
  --glass-3: rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.14);
  --glass-border-2: rgba(255,255,255,0.22);
  --text: #f5f5f7;
  --text-2: rgba(245,245,247,0.7);
  --text-3: rgba(245,245,247,0.4);
  --accent: #0A84FF;
  --accent-g: linear-gradient(135deg,#0A84FF,#5E5CE6);
  --green: #30D158;
  --orange: #FF9F0A;
  --red: #FF453A;
  --purple: #BF5AF2;
  --yellow: #FFD60A;
  --teal: #5AC8FA;
  --mesh: radial-gradient(ellipse at 20% 20%, rgba(94,92,230,0.3) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 80%, rgba(10,132,255,0.25) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(191,90,242,0.15) 0%, transparent 60%);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
  background: var(--bg-base);
  color: var(--text);
  font-family: 'Nunito', -apple-system, sans-serif;
  min-height: 100vh;
  overscroll-behavior-y: none;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--mesh);
  z-index: 0;
  pointer-events: none;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 14px 20px;
  background: rgba(10,10,15,0.6);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.6));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-left .role-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 100px;
  font-weight: 600;
  margin-top: 2px;
  display: inline-block;
}

.role-director { background: rgba(255,214,10,0.2); color: var(--yellow); }
.role-worker   { background: rgba(10,132,255,0.2); color: var(--accent); }

.header-right {
  display: flex;
  gap: 8px;
  align-items: center;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  backdrop-filter: var(--blur-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.icon-btn:active { transform: scale(0.9); }

/* TABS */
.tabs-wrap {
  position: sticky;
  top: 65px;
  z-index: 90;
  background: rgba(10,10,15,0.5);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar{display:none;}

.tab {
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.25s;
  backdrop-filter: var(--blur-sm);
}

.tab.active {
  background: var(--glass-2);
  border-color: var(--glass-border-2);
  color: var(--text);
  box-shadow: 0 0 20px rgba(10,132,255,0.2);
}

/* STATUS FILTER */
.status-tabs {
  display: flex;
  gap: 6px;
  padding: 8px 16px 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.status-tabs::-webkit-scrollbar{display:none;}

.stab {
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid var(--glass-border);
  color: var(--text-2);
  background: var(--glass-1);
  transition: all 0.2s;
}

.stab.active {
  color: #fff;
  border-color: var(--accent);
  background: rgba(10,132,255,0.25);
}

/* SEARCH */
.search-wrap {
  padding: 10px 16px 0;
}

.search-input {
  width: 100%;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 10px 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  backdrop-filter: var(--blur-sm);
  transition: border-color 0.2s;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent);
}

.search-input::placeholder { color: var(--text-3); }

/* CONTENT */
.content {
  padding: 12px 16px 120px;
  position: relative;
  z-index: 1;
}

/* CARDS */
.order-card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 10px;
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.order-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
}

.order-card:active {
  transform: scale(0.98);
  background: var(--glass-2);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  gap: 10px;
}

.card-client-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.card-phone {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 2px;
}

.badge {
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.b-new      { background: rgba(90,200,250,0.15); color: var(--teal); }
.b-measure  { background: rgba(255,159,10,0.15); color: var(--orange); }
.b-design   { background: rgba(191,90,242,0.15); color: var(--purple); }
.b-prod     { background: rgba(255,159,10,0.2);  color: var(--orange); }
.b-done     { background: rgba(48,209,88,0.15);  color: var(--green); }
.b-deliver  { background: rgba(10,132,255,0.15); color: var(--accent); }
.b-cancel   { background: rgba(255,69,58,0.15);  color: var(--red); }
.b-kabyl    { background: rgba(90,200,250,0.15); color: var(--teal); }

.card-furniture {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 10px;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid var(--glass-border);
}

.card-price {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.card-deadline {
  font-size: 12px;
  color: var(--text-2);
}

.card-deadline.urgent { color: var(--red); }

.card-worker {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 6px;
}

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px 12px;
  backdrop-filter: var(--blur-sm);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

.stat-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  margin-bottom: 6px;
}

.stat-val {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.stat-val.blue   { color: var(--accent); }
.stat-val.green  { color: var(--green); }
.stat-val.orange { color: var(--orange); }
.stat-val.purple { color: var(--purple); }
.stat-val.yellow { color: var(--yellow); }

/* FINANCE (director only) */
.finance-card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 16px;
  backdrop-filter: var(--blur-sm);
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.finance-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

.fin-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--glass-border);
}

.fin-row:last-child { border-bottom: none; }

.fin-label { font-size: 13px; color: var(--text-2); }
.fin-val { font-size: 16px; font-weight: 700; }
.fin-val.green { color: var(--green); }
.fin-val.orange { color: var(--orange); }
.fin-val.yellow { color: var(--yellow); }

/* STATUS BAR */
.status-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.status-bar::-webkit-scrollbar{display:none;}

.sbar-item {
  text-align: center;
  flex-shrink: 0;
}

.sbar-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin: 0 auto 4px;
}

.sbar-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
}

/* CLIENT CARD */
.client-card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 8px;
  backdrop-filter: var(--blur-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.client-card:active { background: var(--glass-2); }

.client-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}

.client-info { flex: 1; }
.client-name { font-size: 15px; font-weight: 700; }
.client-phone { font-size: 12px; color: var(--text-2); margin-top: 2px; }

.client-orders-badge {
  background: rgba(10,132,255,0.2);
  color: var(--accent);
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
}

/* WORKER CARD */
.worker-card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 8px;
  backdrop-filter: var(--blur-sm);
  display: flex;
  align-items: center;
  gap: 12px;
}

.worker-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}

/* FAB */
.fab {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent-g);
  border: none;
  color: #fff;
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 8px 32px rgba(10,132,255,0.5), 0 2px 8px rgba(0,0,0,0.3);
  transition: transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:active { transform: scale(0.9); }

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal.active { display: flex; }

.modal-box {
  background: rgba(18,18,28,0.9);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 28px 28px 0 0;
  width: 100%;
  max-height: 93vh;
  overflow-y: auto;
  padding: 8px 20px calc(32px + env(safe-area-inset-bottom));
  animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--glass-border-2);
  border-radius: 2px;
  margin: 10px auto 18px;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 20px;
}

/* FORM */
.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 12px 14px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  backdrop-filter: var(--blur-sm);
  transition: border-color 0.2s;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(10,132,255,0.15);
}

.field textarea { resize: vertical; min-height: 70px; }

.field select option { background: #1a1a2e; color: var(--text); }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* BUTTONS */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 6px;
}

.btn:active { opacity: 0.75; transform: scale(0.98); }

.btn-primary {
  background: var(--accent-g);
  color: #fff;
  box-shadow: 0 4px 16px rgba(10,132,255,0.4);
}

.btn-glass {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  color: var(--text);
}

.btn-green {
  background: linear-gradient(135deg, #30D158, #34C759);
  color: #fff;
  box-shadow: 0 4px 16px rgba(48,209,88,0.35);
}

.btn-red {
  background: rgba(255,69,58,0.15);
  border: 1px solid rgba(255,69,58,0.3);
  color: var(--red);
}

.btn-purple {
  background: rgba(191,90,242,0.2);
  border: 1px solid rgba(191,90,242,0.3);
  color: var(--purple);
}

/* DETAIL */
.detail-block {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  backdrop-filter: var(--blur-sm);
}

.d-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--glass-border);
  gap: 10px;
}

.d-row:last-child { border-bottom: none; }

.d-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.d-val {
  font-size: 14px;
  font-weight: 600;
  text-align: right;
  color: var(--text);
}

.d-val.green  { color: var(--green); }
.d-val.orange { color: var(--orange); }
.d-val.blue   { color: var(--accent); font-size: 18px; font-weight: 800; }

/* STATUS PICKER */
.status-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}

.s-opt {
  padding: 12px;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.s-opt.active {
  background: rgba(10,132,255,0.25);
  border-color: var(--accent);
  color: var(--accent);
}

/* PDF PREVIEW */
.pdf-preview {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  color: #1a1a1a;
  margin: 12px 0;
}

.pdf-logo { font-size: 20px; font-weight: 800; color: #0A84FF; margin-bottom: 16px; }
.pdf-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #333; }
.pdf-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; color: #555; }
.pdf-row:last-child { border-bottom: none; }
.pdf-total { font-size: 18px; font-weight: 800; color: #0A84FF; margin-top: 10px; }

/* NOTIFICATION TEMPLATE */
.notif-template {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px;
  margin: 10px 0;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  white-space: pre-line;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.15);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border-2);
  color: #fff;
  padding: 12px 22px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
  z-index: 400;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show { opacity: 1; }

/* LOADING */
.loading {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-3);
}

.spin {
  width: 28px;
  height: 28px;
  border: 2px solid var(--glass-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}

.empty-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.3; }
.empty-text { font-size: 17px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }

/* EDIT BTN */
.edit-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: rgba(10,132,255,0.15);
  border: 1px solid rgba(10,132,255,0.3);
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  margin-top: 8px;
}

/* SECTION TITLE */
.sec-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 20px 0 10px;
  padding-left: 4px;
}

/* DIRECTOR LOCK */
.director-only { display: none; }

/* NOTIFY BADGE */
.notify-msg {
  background: rgba(48,209,88,0.1);
  border: 1px solid rgba(48,209,88,0.25);
  border-radius: 14px;
  padding: 12px 14px;
  margin: 8px 0;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
}

.notify-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

/* ACCESS DENIED */
.access-denied {
  text-align: center;
  padding: 40px 20px;
}

.access-icon { font-size: 48px; margin-bottom: 12px; }

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const SUPABASE_URL = 'https://udaijfkqxrafadhxktzl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkYWlqZmtxeHJhZmFkaHhrdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTk5MzAsImV4cCI6MjA5NDI5NTkzMH0.MFMk4IJRbv7bGFwK6uYkj19b0v1rDS4h8VcBvrBZGQA';

// РӨЛДЕР — Суpabase-те team_members кестесінде сақталады
// access_code — кіру коды, role — 'director' немесе 'worker'
// Директор БАРЛЫҒЫН көреді, жұмысшы тек өзінің тапсырыстарын

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0a0a0f');
  tg.setBackgroundColor('#0a0a0f');
}

// STATE
let orders = [];
let clients = [];
let workers = [];
let currentUser = null;
let currentView = 'orders';
let currentStatus = 'all';
let currentSearch = '';
const STATUSES = ['Жаңа','Өлшеу','Дизайн','Өндіріс','Монтаж','Дайын','Жеткізілді','Бас тартылды'];
const STATUS_BADGE = {
  'Жаңа':'b-kabyl','Өлшеу':'b-measure','Дизайн':'b-design',
  'Өндіріс':'b-prod','Монтаж':'b-prod','Дайын':'b-done',
  'Жеткізілді':'b-deliver','Бас тартылды':'b-cancel'
};
const STATUS_EMOJI = {
  'Жаңа':'🆕','Өлшеу':'📐','Дизайн':'🎨','Өндіріс':'🔨',
  'Монтаж':'🔧','Дайын':'✅','Жеткізілді':'🚚','Бас тартылды':'❌'
};

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
async function initAuth() {
  // Check localStorage for saved user
  const saved = localStorage.getItem('crm_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showApp();
    return;
  }
  document.getElementById('loginScreen').style.display = 'flex';
}

async function doLogin() {
  const code = document.getElementById('loginCode').value.trim();
  if (!code) { showToast('⚠ Кодты енгізіңіз'); return; }

  const { data, error } = await sb
    .from('team_members')
    .select('*')
    .eq('access_code', code)
    .eq('active', true)
    .maybeSingle();

  if (error || !data) {
    showToast('❌ Код дұрыс емес');
    return;
  }

  currentUser = data;
  localStorage.setItem('crm_user', JSON.stringify(data));
  document.getElementById('loginScreen').style.display = 'none';
  showApp();
}

function doLogout() {
  if (!confirm('Шыққыңыз келе ме?')) return;
  localStorage.removeItem('crm_user');
  location.reload();
}

function showApp() {
  document.getElementById('app').style.display = 'block';

  const isDir = currentUser.role === 'director';

  // Role badge
  const badge = document.getElementById('roleBadge');
  badge.textContent = isDir ? '👑 Директор' : '👷 ' + currentUser.name;
  badge.className = 'role-badge ' + (isDir ? 'role-director' : 'role-worker');

  // Show director-only elements
  if (isDir) {
    document.querySelectorAll('.director-only').forEach(el => {
      el.style.display = el.classList.contains('tab') ? 'block' : 'flex';
    });
    document.getElementById('notifBtn').style.display = 'flex';
  }

  loadAll();
}

// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════
async function loadAll() {
  await loadWorkers();
  await loadOrders();
  await loadClients();
}

async function loadOrders() {
  let q = sb.from('orders').select('*, clients(name,phone,address)').order('created_at', { ascending: false });

  // Worker sees only their orders
  if (currentUser.role === 'worker') {
    q = q.eq('worker', currentUser.name);
  }

  const { data, error } = await q;
  if (error) { showToast('Қате: ' + error.message); return; }
  orders = data || [];
  renderOrders();
  renderStats();
}

async function loadClients() {
  const { data } = await sb.from('clients').select('*, orders(count)').order('created_at', { ascending: false });
  clients = data || [];
  renderClients();
}

async function loadWorkers() {
  const { data } = await sb.from('team_members').select('*').eq('active', true);
  workers = data || [];
  // Populate worker selects
  ['f_worker','e_worker'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '<option value="">Таңдаңыз</option>';
    workers.filter(w => w.role === 'worker').forEach(w => {
      sel.innerHTML += `<option value="${w.name}">${w.name}</option>`;
    });
  });
}

// ═══════════════════════════════════════
// RENDER ORDERS
// ═══════════════════════════════════════
function renderOrders() {
  const list = document.getElementById('ordersList');
  let filtered = [...orders];

  if (currentStatus !== 'all') {
    filtered = filtered.filter(o => o.status === currentStatus);
  }

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(o =>
      (o.clients?.name||'').toLowerCase().includes(q) ||
      (o.clients?.phone||'').includes(q) ||
      (o.furniture_type||'').toLowerCase().includes(q) ||
      (o.worker||'').toLowerCase().includes(q)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🪑</div><div class="empty-text">Тапсырыс жоқ</div></div>`;
    return;
  }

  const isDir = currentUser.role === 'director';

  list.innerHTML = filtered.map(o => {
    const days = daysUntil(o.deadline);
    const urgent = days !== null && days <= 3 && !['Жеткізілді','Бас тартылды'].includes(o.status);
    const deadText = o.deadline
      ? (days < 0 ? `⚠️ ${Math.abs(days)} күн кешікті` : days === 0 ? '⚡ Бүгін' : `📅 ${fmtDate(o.deadline)}`)
      : '—';

    const priceHtml = isDir
      ? `<div class="card-price">${fmt(o.price)}</div>`
      : `<div class="card-price" style="color:var(--text-2);font-size:14px">${o.furniture_type}</div>`;

    return `<div class="order-card" onclick="openDetail(${o.id})">
      <div class="card-top">
        <div>
          <div class="card-client-name">${o.clients?.name || '—'}</div>
          <div class="card-phone">${o.clients?.phone || ''}</div>
        </div>
        <div class="badge ${STATUS_BADGE[o.status]||'b-kabyl'}">${STATUS_EMOJI[o.status]||''} ${o.status}</div>
      </div>
      <div class="card-furniture">${o.furniture_type || ''}${o.dimensions ? ' · ' + o.dimensions : ''}</div>
      <div class="card-footer">
        ${priceHtml}
        <div class="card-deadline ${urgent?'urgent':''}">${deadText}</div>
      </div>
      ${o.worker ? `<div class="card-worker">👷 ${o.worker}</div>` : ''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// RENDER CLIENTS
// ═══════════════════════════════════════
function renderClients() {
  const list = document.getElementById('clientsList');
  const q = document.getElementById('clientSearch')?.value.toLowerCase() || '';
  let filtered = clients;
  if (q) filtered = clients.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));

  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">Клиент жоқ</div></div>';
    return;
  }

  list.innerHTML = filtered.map(c => {
    const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<div class="client-card" onclick="callClient('${c.phone}')">
      <div class="client-avatar">${initials}</div>
      <div class="client-info">
        <div class="client-name">${c.name}</div>
        <div class="client-phone">${c.phone||'—'} ${c.address ? '· ' + c.address : ''}</div>
      </div>
      <div class="client-orders-badge">${c.orders?.[0]?.count||0}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// RENDER STATS (director only)
// ═══════════════════════════════════════
function renderStats() {
  if (!document.getElementById('statsGrid')) return;

  const total   = orders.length;
  const active  = orders.filter(o => !['Жеткізілді','Бас тартылды'].includes(o.status)).length;
  const done    = orders.filter(o => o.status === 'Дайын').length;
  const deliver = orders.filter(o => o.status === 'Жеткізілді').length;
  const totalP  = orders.reduce((s,o) => s + Number(o.price||0), 0);
  const totalA  = orders.reduce((s,o) => s + Number(o.advance||0), 0);
  const totalR  = totalP - totalA;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Барлығы</div><div class="stat-val blue">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Белсенді</div><div class="stat-val orange">${active}</div></div>
    <div class="stat-card"><div class="stat-label">Аяқталды</div><div class="stat-val green">${deliver}</div></div>
  `;

  document.getElementById('financeBlock').innerHTML = `
    <div class="fin-row"><div class="fin-label">Жалпы сомасы</div><div class="fin-val yellow">${fmt(totalP)}</div></div>
    <div class="fin-row"><div class="fin-label">Алынды (аванс)</div><div class="fin-val green">${fmt(totalA)}</div></div>
    <div class="fin-row"><div class="fin-label">Қалды</div><div class="fin-val orange">${fmt(totalR)}</div></div>
    <div class="fin-row"><div class="fin-label">Клиенттер</div><div class="fin-val">${clients.length}</div></div>
  `;

  document.getElementById('statusStats').innerHTML = STATUSES.map(s => {
    const cnt = orders.filter(o => o.status === s).length;
    return `<div class="fin-row"><div class="fin-label">${STATUS_EMOJI[s]} ${s}</div><div class="fin-val">${cnt}</div></div>`;
  }).join('');

  // Render workers
  renderWorkers();
}

function renderWorkers() {
  const list = document.getElementById('workersList');
  if (!list) return;

  if (!workers.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👷</div><div class="empty-text">Жұмысшылар жоқ</div></div>';
    return;
  }

  list.innerHTML = `
    <div class="sec-title">Команда мүшелері</div>
    ${workers.map(w => {
      const wOrders = orders.filter(o => o.worker === w.name);
      const wActive = wOrders.filter(o => !['Жеткізілді','Бас тартылды'].includes(o.status)).length;
      const initials = w.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
      const colors = ['#0A84FF','#30D158','#FF9F0A','#BF5AF2','#FF453A','#5AC8FA'];
      const color = colors[w.id % colors.length];
      const roleName = w.role === 'director' ? '👑 Директор' : '👷 Жұмысшы';
      return `<div class="worker-card">
        <div class="worker-avatar" style="background:linear-gradient(135deg,${color},${color}88)">${initials}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:15px">${w.name}</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:2px">${roleName}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:var(--accent)">${wActive}</div>
          <div style="font-size:11px;color:var(--text-3)">белсенді</div>
        </div>
      </div>`;
    }).join('')}

    <div class="sec-title" style="margin-top:24px">Жұмысшы қосу</div>

    'Бас тартылды': `Сәлеметсіз бе, ${name}!\n\nӨкінішке орай тапсырысыңыз бойынша байланысу қажет.\n\nБізбен хабарласыңыз. 📞`

function copyNotif(id) {
  const el = document.getElementById('notifText-' + id);
  if (!el) return;
  const text = el.textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 Хабарлама көшірілді'));
  } else {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 Хабарлама көшірілді');
  }
}

async function downloadPdf(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    doc.setFont('helvetica');
    doc.setFontSize(20);
    doc.setTextColor(10, 132, 255);
    doc.text('Мебель CRM Pro', 20, 25);

    doc.setFontSize(10);
    doc.setTextColor(100, 100, 100);
    doc.text('Дата: ' + new Date().toLocaleDateString(), 20, 33);

    doc.setFontSize(14);
    doc.setTextColor(30, 30, 30);
    doc.text('ЦЕНОВОЕ ПРЕДЛОЖЕНИЕ / БАҒА ҰСЫНЫСЫ', 20, 46);

    doc.setDrawColor(10, 132, 255);
    doc.setLineWidth(0.5);
    doc.line(20, 49, 190, 49);

    const rows = [
      ['Клиент', o.clients?.name || '—'],
      ['Телефон', o.clients?.phone || '—'],
      ['Мекенжай', o.clients?.address || '—'],
      ['Мебель түрі', o.furniture_type || '—'],
      ['Өлшемі', o.dimensions || '—'],
      ['Материал', o.material || '—'],
      ['Мерзім', fmtDate(o.deadline)],
    ];

    if (o.notes) rows.push(['Ескертпе', o.notes]);

    doc.setFontSize(11);
    let y = 58;
    rows.forEach(([label, val]) => {
      doc.setTextColor(120, 120, 120);
      doc.text(label + ':', 20, y);
      doc.setTextColor(30, 30, 30);
      doc.text(String(val), 70, y);
      y += 9;
    });

    y += 5;
    doc.setDrawColor(200, 200, 200);
    doc.line(20, y, 190, y);
    y += 10;

    doc.setFontSize(13);
    doc.setTextColor(30, 30, 30);
    doc.text('Жалпы сомасы:', 20, y);
    doc.setTextColor(10, 132, 255);
    doc.text(fmt(o.price), 100, y);
    y += 10;

    doc.setTextColor(30, 30, 30);
    doc.text('Аванс алынды:', 20, y);
    doc.setTextColor(48, 209, 88);
    doc.text(fmt(o.advance), 100, y);
    y += 10;

    doc.setTextColor(30, 30, 30);
    doc.text('Қалдық сома:', 20, y);
    doc.setTextColor(255, 159, 10);
    doc.text(fmt((o.price||0)-(o.advance||0)), 100, y);

    doc.save(`baga-usynys-${o.clients?.name||'client'}.pdf`);
    showToast('✅ PDF жүктелді');
  } catch(e) {
    showToast('PDF жасау қатесі: ' + e.message);
  }
}

function sharePdf(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  const remaining = (o.price||0)-(o.advance||0);
  const text = `📋 БАҒА ҰСЫНЫСЫ\n\nКлиент: ${o.clients?.name}\nМебель: ${o.furniture_type}\nӨлшемі: ${o.dimensions||'—'}\nМатериал: ${o.material||'—'}\nМерзім: ${fmtDate(o.deadline)}\n\n💰 Жалпы: ${fmt(o.price)}\n✅ Аванс: ${fmt(o.advance)}\n⏳ Қалдық: ${fmt(remaining)}\n\nСізбен жұмыс істегеніміз қуаныш! 🪑`;

async function saveOrder() {
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const furniture = document.getElementById('f_furniture').value.trim();

  if (!name || !phone || !furniture) {
    showToast('⚠ Аты, телефон, мебель түрін толтырыңыз');
    return;
  }

  const btn = document.getElementById('saveOrderBtn');
  btn.textContent = 'Сақталуда...';
  btn.disabled = true;

  let { data: existing } = await sb.from('clients').select('id').eq('phone', phone).maybeSingle();
  let clientId;

  if (existing) {
    clientId = existing.id;
  } else {
    const { data: newC, error: cE } = await sb.from('clients').insert({
      name, phone,
      address: document.getElementById('f_address').value.trim() || null
    }).select('id').single();
    if (cE) { showToast('Қате: ' + cE.message); btn.textContent='💾 Сақтау'; btn.disabled=false; return; }
    clientId = newC.id;
  }

  const isDir = currentUser.role === 'director';
  const orderData = {
    client_id: clientId,
    furniture_type: furniture,
    dimensions: document.getElementById('f_dim').value.trim() || null,
    material: document.getElementById('f_material').value.trim() || null,
    notes: document.getElementById('f_notes').value.trim() || null,
    deadline: document.getElementById('f_deadline').value || null,
    worker: document.getElementById('f_worker').value || null,
    status: 'Жаңа',
    price: isDir ? (Number(document.getElementById('f_price').value)||0) : 0,
    advance: isDir ? (Number(document.getElementById('f_advance').value)||0) : 0,
  };

  const { error } = await sb.from('orders').insert(orderData);
  btn.textContent = '💾 Сақтау';
  btn.disabled = false;

  if (error) { showToast('Қате: ' + error.message); return; }

  showToast('✅ Тапсырыс сақталды');
  closeModal('addModal');
  clearAddForm();
  tg?.HapticFeedback?.notificationOccurred('success');
  await loadOrders();
  await loadClients();
}

function clearAddForm() {
  ['f_name','f_phone','f_address','f_furniture','f_dim','f_material','f_price','f_advance','f_deadline','f_notes','f_worker'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
}

async function deleteOrder(id) {
  if (!confirm('Тапсырысты жоюды растаңыз')) return;
  const { error } = await sb.from('orders').delete().eq('id', id);
  if (error) { showToast('Қате: ' + error.message); return; }
  showToast('🗑 Жойылды');
  closeModal('detailModal');
  await loadOrders();
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function fmt(n) {
  return new Intl.NumberFormat('kk-KZ').format(n||0) + ' ₸';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('kk-KZ', { day:'2-digit', month:'short', year:'numeric' });
}

function daysUntil(d) {
  if (!d) return null;
  return Math.ceil((new Date(d) - new Date()) / (1000*60*60*24));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function callClient(phone) {
  if (phone) window.open('tel:' + phone);
}
