<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мебель CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E0C;
    --surface: #1A1816;
    --surface-2: #242019;
    --border: #2E2922;
    --text: #F5F0E6;
    --text-dim: #A89F8E;
    --text-faint: #6B6557;
    --accent: #D4A574;
    --accent-warm: #E8B98A;
    --green: #7FB069;
    --orange: #E08D3C;
    --red: #C45D5D;
    --blue: #6B9BD1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overscroll-behavior-y: none;
  }

  body {
    padding-bottom: env(safe-area-inset-bottom);
    padding-top: env(safe-area-inset-top);
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    z-index: 100;
    backdrop-filter: blur(20px);
    background: rgba(15, 14, 12, 0.85);
  }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header h1::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bg);
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 16px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .stat-value.accent { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }

  /* Content */
  .content {
    padding: 0 16px 100px;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 20px 0 12px;
    padding-left: 4px;
  }

  /* Order card */
  .order-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .order-card:active {
    transform: scale(0.98);
    background: var(--surface-2);
  }

  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 10px;
  }

  .order-client {
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .order-phone {
    font-size: 13px;
    color: var(--text-dim);
  }

  .status-badge {
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-қабылданды { background: rgba(107, 155, 209, 0.15); color: var(--blue); }
  .status-жасалуда   { background: rgba(224, 141, 60, 0.15); color: var(--orange); }
  .status-дайын      { background: rgba(127, 176, 105, 0.15); color: var(--green); }
  .status-жеткізілді { background: rgba(127, 176, 105, 0.2); color: var(--green); }
  .status-бас        { background: rgba(196, 93, 93, 0.15); color: var(--red); }

  .order-furniture {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .order-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  .order-price {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  .order-deadline {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .order-deadline.urgent { color: var(--red); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-text {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin-bottom: 6px;
    color: var(--text-dim);
  }

  .empty-hint {
    font-size: 13px;
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    font-size: 28px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(212, 165, 116, 0.4), 0 2px 8px rgba(0,0,0,0.3);
    z-index: 50;
    transition: transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fab:active { transform: scale(0.92); }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  .modal.active { display: flex; }

  .modal-content {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 8px 20px 30px;
    animation: slideUp 0.3s ease-out;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 8px auto 16px;
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  /* Form */
  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    transition: border-color 0.2s;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea {
    resize: vertical;
    min-height: 70px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn:active { opacity: 0.7; }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    margin-top: 8px;
  }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-danger {
    background: rgba(196, 93, 93, 0.15);
    color: var(--red);
    border: 1px solid rgba(196, 93, 93, 0.3);
  }

  /* Order detail */
  .detail-section {
    background: var(--surface-2);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 14px;
  }

  .detail-row:last-child { border-bottom: none; }

  .detail-label {
    color: var(--text-faint);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .detail-value {
    color: var(--text);
    text-align: right;
    font-weight: 500;
    flex: 1;
    margin-left: 12px;
  }

  .detail-value.accent {
    color: var(--accent);
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
  }

  /* Status selector */
  .status-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .status-option {
    padding: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .status-option.selected {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-faint);
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .toast.show { opacity: 1; }

  /* Search */
  .search-bar {
    padding: 12px 16px;
    background: var(--bg);
  }

  .search-bar input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }

  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Client card */
  .client-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .client-card:active { background: var(--surface-2); }

  .client-info { flex: 1; }
  .client-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .client-phone { font-size: 13px; color: var(--text-dim); }
  .client-orders {
    background: var(--surface-2);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>

<header class="header">
  <h1>Мебель CRM</h1>
</header>

<div class="tabs" id="mainTabs">
  <div class="tab active" data-view="orders">📋 Тапсырыстар</div>
  <div class="tab" data-view="clients">👥 Клиенттер</div>
  <div class="tab" data-view="stats">📊 Есеп</div>
</div>

<!-- Orders View -->
<div id="ordersView">
  <div class="search-bar">
    <input type="text" id="orderSearch" placeholder="🔍 Іздеу: клиент аты, телефон, мебель...">
  </div>

  <div class="tabs" id="statusFilter">
    <div class="tab active" data-status="all">Барлығы</div>
    <div class="tab" data-status="қабылданды">Қабылданды</div>
    <div class="tab" data-status="жасалуда">Жасалуда</div>
    <div class="tab" data-status="дайын">Дайын</div>
    <div class="tab" data-status="жеткізілді">Жеткізілді</div>
  </div>

  <div class="content" id="ordersList">
    <div class="loading"><div class="spinner"></div>Жүктелуде...</div>
  </div>
</div>

<!-- Clients View -->
<div id="clientsView" style="display:none">
  <div class="search-bar">
    <input type="text" id="clientSearch" placeholder="🔍 Клиент іздеу...">
  </div>
  <div class="content" id="clientsList">
    <div class="loading"><div class="spinner"></div>Жүктелуде...</div>
  </div>
</div>

<!-- Stats View -->
<div id="statsView" style="display:none">
  <div class="content">
    <div class="stats" id="statsBlock"></div>
    <div class="section-title">Қаржы</div>
    <div class="detail-section" id="financeBlock"></div>
    <div class="section-title">Статус бойынша</div>
    <div class="detail-section" id="statusBlock"></div>
  </div>
</div>

<button class="fab" id="fabBtn">+</button>

<!-- Add Order Modal -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <div class="modal-handle"></div>
    <div class="modal-title">Жаңа тапсырыс</div>

    <div class="field">
      <label>Клиент аты *</label>
      <input type="text" id="f_name" placeholder="Айгүл Сапарова">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Телефон *</label>
        <input type="tel" id="f_phone" placeholder="+7 700 000 0000">
      </div>
      <div class="field">
        <label>Мекенжай</label>
        <input type="text" id="f_address" placeholder="Қала, көше">
      </div>
    </div>

    <div class="field">
      <label>Мебель түрі *</label>
      <input type="text" id="f_furniture" placeholder="Ас үй жиһазы, диван, шкаф...">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Өлшемі</label>
        <input type="text" id="f_dim" placeholder="2.5×0.6×0.9 м">
      </div>
      <div class="field">
        <label>Материал</label>
        <input type="text" id="f_material" placeholder="МДФ, массив...">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Жалпы баға (₸)</label>
        <input type="number" id="f_price" placeholder="350000">
      </div>
      <div class="field">
        <label>Аванс (₸)</label>
        <input type="number" id="f_advance" placeholder="150000">
      </div>
    </div>

    <div class="field">
      <label>Мерзім</label>
      <input type="date" id="f_deadline">
    </div>

    <div class="field">
      <label>Ескертпе</label>
      <textarea id="f_notes" placeholder="Қосымша ақпарат..."></textarea>
    </div>

    <button class="btn btn-primary" id="saveOrderBtn">Сақтау</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="closeModal('addModal')">Болдырмау</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-content" id="detailContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// === КОНФИГ ===
const SUPABASE_URL = 'https://udaijfkqxrafadhxktzl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkYWlqZmtxeHJhZmFkaHhrdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTk5MzAsImV4cCI6MjA5NDI5NTkzMH0.MFMk4IJRbv7bGFwK6uYkj19b0v1rDS4h8VcBvrBZGQA';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram?.WebApp;

// Telegram setup
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0F0E0C');
  tg.setBackgroundColor('#0F0E0C');
}

const user = tg?.initDataUnsafe?.user;
const userId = user?.id || 0;

// State
let orders = [];
let clients = [];
let currentStatus = 'all';
let currentSearch = '';
let currentView = 'orders';

// === Helpers ===
function fmt(n) {
  return new Intl.NumberFormat('kk-KZ').format(n || 0) + ' ₸';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('kk-KZ', { day:'2-digit', month:'short' });
}

function daysUntil(d) {
  if (!d) return null;
  const diff = Math.ceil((new Date(d) - new Date()) / (1000*60*60*24));
  return diff;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
  tg?.HapticFeedback?.notificationOccurred('success');
}

function statusClass(s) {
  if (s === 'бас тартылды') return 'status-бас';
  return 'status-' + s;
}

// === Data ===
async function loadOrders() {
  const { data, error } = await sb
    .from('orders')
    .select('*, clients(name, phone, address)')
    .order('created_at', { ascending: false });
  if (error) { console.error(error); toast('Қате: ' + error.message); return; }
  orders = data || [];
  renderOrders();
  renderStats();
}

async function loadClients() {
  const { data, error } = await sb
    .from('clients')
    .select('*, orders(count)')
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  clients = data || [];
  renderClients();
}

// === Render Orders ===
function renderOrders() {
  const list = document.getElementById('ordersList');
  let filtered = orders;

  if (currentStatus !== 'all') {
    filtered = filtered.filter(o => o.status === currentStatus);
  }

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(o =>
      (o.clients?.name || '').toLowerCase().includes(q) ||
      (o.clients?.phone || '').includes(q) ||
      (o.furniture_type || '').toLowerCase().includes(q)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🪑</div>
        <div class="empty-text">Тапсырыс жоқ</div>
        <div class="empty-hint">+ батырмасын басып, жаңасын қосыңыз</div>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const days = daysUntil(o.deadline);
    const urgent = days !== null && days <= 3 && o.status !== 'жеткізілді';
    const deadlineText = o.deadline
      ? (days < 0 ? `⚠ ${Math.abs(days)} күн кешікті` : days === 0 ? '⚡ Бүгін' : `📅 ${fmtDate(o.deadline)}`)
      : '📅 Мерзім жоқ';

    return `
      <div class="order-card" onclick="openDetail(${o.id})">
        <div class="order-header">
          <div>
            <div class="order-client">${o.clients?.name || 'Белгісіз'}</div>
            <div class="order-phone">${o.clients?.phone || ''}</div>
          </div>
          <div class="status-badge ${statusClass(o.status)}">${o.status}</div>
        </div>
        <div class="order-furniture">${o.furniture_type || ''}</div>
        <div class="order-footer">
          <div class="order-price">${fmt(o.price)}</div>
          <div class="order-deadline ${urgent ? 'urgent' : ''}">${deadlineText}</div>
        </div>
      </div>`;
  }).join('');
}

// === Render Clients ===
function renderClients() {
  const list = document.getElementById('clientsList');
  const search = document.getElementById('clientSearch').value.toLowerCase();

  let filtered = clients;
  if (search) {
    filtered = clients.filter(c =>
      c.name.toLowerCase().includes(search) ||
      (c.phone || '').includes(search)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">Клиент жоқ</div></div>';
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="client-card" onclick="callClient('${c.phone}')">
      <div class="client-info">
        <div class="client-name">${c.name}</div>
        <div class="client-phone">${c.phone || '—'}</div>
      </div>
      <div class="client-orders">${c.orders?.[0]?.count || 0} тапсырыс</div>
    </div>`).join('');
}

function callClient(phone) {
  if (phone) window.open(`tel:${phone}`);
}

// === Stats ===
function renderStats() {
  const total = orders.length;
  const active = orders.filter(o => !['жеткізілді','бас тартылды'].includes(o.status)).length;
  const ready = orders.filter(o => o.status === 'дайын').length;

  document.getElementById('statsBlock').innerHTML = `
    <div class="stat"><div class="stat-label">Барлығы</div><div class="stat-value">${total}</div></div>
    <div class="stat"><div class="stat-label">Белсенді</div><div class="stat-value accent">${active}</div></div>
    <div class="stat"><div class="stat-label">Дайын</div><div class="stat-value green">${ready}</div></div>
  `;

  const totalPrice = orders.reduce((s,o) => s + Number(o.price || 0), 0);
  const totalAdvance = orders.reduce((s,o) => s + Number(o.advance || 0), 0);
  const totalRemaining = totalPrice - totalAdvance;

  document.getElementById('financeBlock').innerHTML = `
    <div class="detail-row"><div class="detail-label">Жалпы сома</div><div class="detail-value accent">${fmt(totalPrice)}</div></div>
    <div class="detail-row"><div class="detail-label">Алынды (аванс)</div><div class="detail-value" style="color:var(--green)">${fmt(totalAdvance)}</div></div>
    <div class="detail-row"><div class="detail-label">Қалды</div><div class="detail-value" style="color:var(--orange)">${fmt(totalRemaining)}</div></div>
  `;

  const statuses = ['қабылданды','жасалуда','дайын','жеткізілді','бас тартылды'];
  document.getElementById('statusBlock').innerHTML = statuses.map(s => {
    const count = orders.filter(o => o.status === s).length;
    return `<div class="detail-row"><div class="detail-label">${s}</div><div class="detail-value">${count}</div></div>`;
  }).join('');
}

// === Save Order ===
async function saveOrder() {
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const furniture = document.getElementById('f_furniture').value.trim();

  if (!name || !phone || !furniture) {
    toast('⚠ Аты, телефон, мебель түрін толтырыңыз');
    return;
  }

  const btn = document.getElementById('saveOrderBtn');
  btn.textContent = 'Сақталуда...';
  btn.disabled = true;

  // Find or create client
  let { data: existing } = await sb
    .from('clients').select('id').eq('phone', phone).maybeSingle();

  let clientId;
  if (existing) {
    clientId = existing.id;
  } else {
    const { data: newClient, error: cErr } = await sb
      .from('clients')
      .insert({
        name,
        phone,
        address: document.getElementById('f_address').value.trim() || null,
        created_by: userId
      })
      .select('id').single();
    if (cErr) { toast('Қате: ' + cErr.message); btn.textContent='Сақтау'; btn.disabled=false; return; }
    clientId = newClient.id;
  }

  // Insert order
  const { error: oErr } = await sb.from('orders').insert({
    client_id: clientId,
    furniture_type: furniture,
    dimensions: document.getElementById('f_dim').value.trim() || null,
    material: document.getElementById('f_material').value.trim() || null,
    price: Number(document.getElementById('f_price').value) || 0,
    advance: Number(document.getElementById('f_advance').value) || 0,
    deadline: document.getElementById('f_deadline').value || null,
    notes: document.getElementById('f_notes').value.trim() || null,
    created_by: userId,
    status: 'қабылданды'
  });

  btn.textContent = 'Сақтау';
  btn.disabled = false;

  if (oErr) { toast('Қате: ' + oErr.message); return; }

  toast('✓ Тапсырыс сақталды');
  closeModal('addModal');
  clearForm();
  await loadOrders();
}

function clearForm() {
  ['f_name','f_phone','f_address','f_furniture','f_dim','f_material','f_price','f_advance','f_deadline','f_notes']
    .forEach(id => document.getElementById(id).value = '');
}

// === Detail ===
function openDetail(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;

  const statuses = ['қабылданды','жасалуда','дайын','жеткізілді','бас тартылды'];

  document.getElementById('detailContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${o.clients?.name || 'Тапсырыс'}</div>

    <div class="detail-section">
      <div class="detail-row"><div class="detail-label">Телефон</div><div class="detail-value">${o.clients?.phone || '—'}</div></div>
      <div class="detail-row"><div class="detail-label">Мекенжай</div><div class="detail-value">${o.clients?.address || '—'}</div></div>
      <div class="detail-row"><div class="detail-label">Мебель</div><div class="detail-value">${o.furniture_type}</div></div>
      <div class="detail-row"><div class="detail-label">Өлшемі</div><div class="detail-value">${o.dimensions || '—'}</div></div>
      <div class="detail-row"><div class="detail-label">Материал</div><div class="detail-value">${o.material || '—'}</div></div>
    </div>

    <div class="detail-section">
      <div class="detail-row"><div class="detail-label">Жалпы баға</div><div class="detail-value accent">${fmt(o.price)}</div></div>
      <div class="detail-row"><div class="detail-label">Аванс</div><div class="detail-value" style="color:var(--green)">${fmt(o.advance)}</div></div>
      <div class="detail-row"><div class="detail-label">Қалды</div><div class="detail-value" style="color:var(--orange)">${fmt(o.remaining)}</div></div>
      <div class="detail-row"><div class="detail-label">Мерзім</div><div class="detail-value">${fmtDate(o.deadline)}</div></div>
    </div>

    ${o.notes ? `<div class="detail-section"><div style="font-size:13px;color:var(--text-dim);line-height:1.6">${o.notes}</div></div>` : ''}

    <div class="section-title" style="margin-top:8px">Статусты өзгерту</div>
    <div class="status-options">
      ${statuses.map(s => `
        <div class="status-option ${s === o.status ? 'selected' : ''}" onclick="updateStatus(${o.id}, '${s}')">${s}</div>
      `).join('')}
    </div>

    <button class="btn btn-secondary" style="margin-top:20px" onclick="callClient('${o.clients?.phone || ''}')">📞 Қоңырау шалу</button>
    <button class="btn btn-danger" style="margin-top:8px" onclick="deleteOrder(${o.id})">🗑 Жою</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="closeModal('detailModal')">Жабу</button>
  `;
  document.getElementById('detailModal').classList.add('active');
}

async function updateStatus(id, status) {
  const { error } = await sb.from('orders').update({ status }).eq('id', id);
  if (error) { toast('Қате: ' + error.message); return; }
  toast('✓ Статус: ' + status);
  await loadOrders();
  openDetail(id);
}

async function deleteOrder(id) {
  if (!confirm('Шынымен жою керек пе?')) return;
  const { error } = await sb.from('orders').delete().eq('id', id);
  if (error) { toast('Қате: ' + error.message); return; }
  toast('✓ Жойылды');
  closeModal('detailModal');
  await loadOrders();
}

// === Modals ===
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// === Tabs / Views ===
document.getElementById('mainTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('#mainTabs .tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  const view = e.target.dataset.view;
  currentView = view;
  document.getElementById('ordersView').style.display = view === 'orders' ? 'block' : 'none';
  document.getElementById('clientsView').style.display = view === 'clients' ? 'block' : 'none';
  document.getElementById('statsView').style.display = view === 'stats' ? 'block' : 'none';
  if (view === 'clients') loadClients();
  tg?.HapticFeedback?.selectionChanged();
});

document.getElementById('statusFilter').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('#statusFilter .tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentStatus = e.target.dataset.status;
  renderOrders();
  tg?.HapticFeedback?.selectionChanged();
});

document.getElementById('orderSearch').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderOrders();
});

document.getElementById('clientSearch').addEventListener('input', renderClients);

document.getElementById('fabBtn').addEventListener('click', () => {
  document.getElementById('addModal').classList.add('active');
  tg?.HapticFeedback?.impactOccurred('medium');
});

document.getElementById('saveOrderBtn').addEventListener('click', saveOrder);

// Close modal on backdrop click
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});

// Init
loadOrders();
</script>
</body>
</html>
